name: ChatGPT Temporary Human Asset Fetch

on:
  push:
    branches:
      - chatgpt-temp-human-assets-20260920
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Blender Studio human meshes exported as GLB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/human-assets/output"
          cd "$RUNNER_TEMP/human-assets/output"
          curl -fL --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/GilHyeonSoo/HealthAPP/main/assets/models/blender-human-male.glb" \
            -o blender-human-male.glb
          curl -fL --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/GilHyeonSoo/HealthAPP/main/assets/models/blender-human-female.glb" \
            -o blender-human-female.glb
          curl -fL --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/GilHyeonSoo/HealthAPP/main/assets/models/BLENDER_HUMAN_BASE_MESHES_LICENSE.md" \
            -o BLENDER_HUMAN_BASE_MESHES_LICENSE.md
          file *.glb
          test "$(stat -c %s blender-human-male.glb)" -gt 1000000
          test "$(stat -c %s blender-human-female.glb)" -gt 1000000
      - name: Upload selected assets
        uses: actions/upload-artifact@v4
        with:
          name: blender-human-base-meshes-glb
          path: ${{ runner.temp }}/human-assets/output
          compression-level: 0
          retention-days: 1

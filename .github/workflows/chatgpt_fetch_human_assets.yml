name: ChatGPT Temporary Blender Runtime Fetch

on:
  push:
    branches:
      - chatgpt-temp-human-assets-20260920
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download stable Blender LTS runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/blender-runtime/output"
          cd "$RUNNER_TEMP/blender-runtime/output"
          curl -fL --retry 5 --retry-delay 3 \
            "https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz" \
            -o blender-4.2.23-linux-x64.tar.xz
          file blender-4.2.23-linux-x64.tar.xz
          test "$(stat -c %s blender-4.2.23-linux-x64.tar.xz)" -gt 200000000
          sha256sum blender-4.2.23-linux-x64.tar.xz > blender-4.2.23-linux-x64.tar.xz.sha256
      - name: Upload Blender runtime
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-linux-x64
          path: ${{ runner.temp }}/blender-runtime/output
          compression-level: 0
          retention-days: 1
